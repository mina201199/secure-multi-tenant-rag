<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}公司知識文件平台{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#172b40;margin:0;line-height:1.7}
    main{max-width:880px;margin:48px auto;padding:28px;background:white;border-radius:12px}
    h1{line-height:1.3}a{color:#075c9e}label{display:block;margin-top:16px}
    input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #8293a2;border-radius:5px}
    input[type=checkbox]{width:auto;margin-right:8px}textarea{min-height:140px}
    section{border-top:1px solid #dce3e9;padding-top:20px;margin-top:24px}
    .links{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}.danger{background:#9a3030}
    button{background:#125b80;color:white;border:0;border-radius:5px;padding:10px 18px;cursor:pointer;margin-top:16px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3e9}
    .muted{color:#526578}.content{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #dce3e9;padding-top:20px}
    nav{display:flex;justify-content:space-between;align-items:center;gap:20px}
    @media(max-width:600px){main{margin:12px;padding:18px}th,td{padding:8px}}
  </style>
</head>
<body><main>
  {% if test_mode %}<p style="background:#fff2cc;padding:10px">測試環境：模型使用替身；本頁不代表真實 OpenAI 回答品質。</p>{% endif %}
  {% if identity %}
  <nav>
    <div><strong>{{ identity.tenant_name }}</strong> · {{ identity.display_name }}<br><span class="muted">{{ identity.username }}</span></div>
    <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button type="submit">登出</button></form>
  </nav>
  <div class="links"><a href="/documents">可讀文件</a><a href="/manage">我管理的文件</a>
    <a href="/ask">文件問答</a><a href="/upload">上傳文件</a>
    <a href="/history">歷史調閱與授權</a><a href="/transfers">交接申請與審核</a>
    {% if identity.role == "admin" %}<a href="/accounts">帳號管理</a>{% endif %}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main></body>
</html>
